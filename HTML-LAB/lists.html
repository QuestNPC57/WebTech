<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered list</title>
</head>
<body>
    <h1><bold>A.</bold>Unordered List</h1>
    <h2><ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Pasta</li>
        <li>Pie</li>
        <li>Chicken</li>
    </ul></h2>
    
    <h1><bold>B.</bold>Ordered List</h1>
    <h2><ol>
        <li>Java</li>
        <li>Python</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>C++</li>
</body>
</html>
