<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <h1>Lab Activity 7: HTML Forms</h1>
    <hr>

    <form action="/action_page.php">
        <label for="fullname">Full Name: </label><br>
        <input type="Text" id="FullName" name="fullname"><br>
        <label for="StudentID">Student ID: </label><br>
        <input type="Text" id="StudentID" name="StudentID"><br>
        <label for="email">Email: </label><br>
        <input type="email" id="email" name="email"><br>
        <label for="Password">Password:</label><br>
        <input type="password"><br>
        <label for="Birthday">Birthday: </label><br>
        <input type="date"><br>
        <label for="Gender">Gender</label><br>
        <input type="radio" id="Male" name="Gender" value="Male">
        <label for="Male">Male</label><br>
        <input type="radio" id="Female" name="Gender" value="Female">
        <label for="Female">Female</label><br>
        <input type="radio" id="Other" name="Gender" value="Other">
        <label for="Other">Other/s</label><br>
        <label for="Program">Program</label><br>
        <input type="radio" id="BSIT" name="Program" value="BSIT">
        <label for="BSIT">BSIT</label>
        <input type="radio" id="BSCS" name="Program" value="BSCS">
        <label for="BSCS">BSCS</label>
        <input type="radio" id="BSIS" name="Program" value="BSIS">
        <label for="BSIS">BSIS</label>
        <input type="radio" id="BSCpE" name="Program" value="BSCpE">
        <label for="BSCpEg">BSCpE</label>
        
        


    </form>
    
</body>
</html>
